<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Planilhas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
  <style>
    /* ── Reset & Base Corporativo ─────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #0F9D58;
      --green-dark:   #0d8a4f;
      --green-light:  #E8F5E9;
      --bg:           #F5F5F5;
      --surface:      #FFFFFF;
      --surface2:     #FAFAFA;
      --border:       rgba(0,0,0,.08);
      --border-med:   rgba(0,0,0,.15);
      --text:         #1C1C1E;
      --text-2:       #5F5E5A;
      --text-3:       #9E9D99;
      --radius-md:    8px;
      --radius-lg:    12px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.05);
      --shadow-md:    0 6px 20px rgba(0,0,0,.08);
      
      --c-log-bg: #FFF8E1; --c-log-txt: #B78103;
      --c-com-bg: #F5F5F7; --c-com-txt: #455A64;
      --c-fat-bg: #E3F2FD; --c-fat-txt: #1E88E5;
      --c-rh-bg:  #F3E5F5; --c-rh-txt:  #8E24AA;
      --c-cmr-bg: #E8F5E9; --c-cmr-txt: #2E7D32;
      --c-fin-bg: #E0F2F1; --c-fin-txt: #00796B;
    }

    body {
      font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ──────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    
    .header-logo {
      width: 36px; height: 36px;
      background: var(--green-light);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--green); font-size: 20px;
    }
    
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p  { font-size: 12px; color: var(--text-2); margin-top: 1px; }

    /* ── Main & Setores ──────────────────────────── */
    .main { padding: 24px 20px; max-width: 960px; margin: 0 auto; }

    .sector {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .sector.open { box-shadow: var(--shadow-md); border-color: var(--border-med); }

    .sector-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background .15s ease;
    }
    .sector-header:hover { background: var(--surface2); }

    .sector-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    
    .icon-log { background: var(--c-log-bg); color: var(--c-log-txt); }
    .icon-com { background: var(--c-com-bg); color: var(--c-com-txt); }
    .icon-fat { background: var(--c-fat-bg); color: var(--c-fat-txt); }
    .icon-rh  { background: var(--c-rh-bg);  color: var(--c-rh-txt); }
    .icon-cmr { background: var(--c-cmr-bg); color: var(--c-cmr-txt); }
    .icon-fin { background: var(--c-fin-bg); color: var(--c-fin-txt); }

    .sector-name  { font-size: 14px; font-weight: 600; flex: 1; color: var(--text); }
    
    .sector-badge {
      font-size: 11px;
      background: var(--green-light);
      color: var(--green-dark);
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 600;
    }
    
    .chevron {
      font-size: 16px;
      color: var(--text-3);
      transition: transform .2s ease;
    }
    .sector.open .chevron { transform: rotate(180deg); color: var(--text-2); }

    .sector-body {
      display: none;
      padding: 18px;
      background: var(--surface2);
      border-top: 0.5px solid var(--border);
    }
    .sector.open .sector-body { display: block; }

    /* ── Grid de Cards ───────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-med);
      transform: translateY(-1px);
    }

    .card-top { display: flex; gap: 10px; align-items: flex-start; }
    
    .card-gs-icon {
      width: 26px; height: 26px;
      flex-shrink: 0;
      background: url("https://ssl.gstatic.com/docs/spreadsheets/favicon3.ico") center/cover;
      border-radius: 4px;
    }
    
    .card-title {
      font-size: 13px; font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }
    
    .card-desc {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.4;
    }
    
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }

    /* ── Botões ──────────────────────────────────── */
    .btn-open {
      flex: 1;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s ease;
    }
    .btn-open:hover { background: var(--green-dark); }

    .btn-del {
      background: none;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text-3);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    .btn-del:hover { border-color: #E53935; color: #E53935; background: #FFEBEE; }

    .btn-add {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 0.5px dashed var(--border-med);
      border-radius: var(--radius-md);
      padding: 10px;
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
      font-family: inherit;
    }
    .btn-add:hover {
      background: var(--green-light);
      color: var(--green-dark);
      border-color: var(--green);
    }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: var(--text-3);
      font-size: 13px;
    }
    .empty-state i { font-size: 32px; display: block; margin-bottom: 8px; color: var(--text-3); }

    /* ── Modais ──────────────────────────────────── */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
      display: none; align-items: center; justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-bg.show { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--border-med);
      padding: 24px;
      width: 420px; max-width: 100%;
      box-shadow: var(--shadow-md);
      animation: pop .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-header { margin-bottom: 18px; }
    .modal-header h2 { font-size: 16px; font-weight: 600; color: var(--text); }
    .modal-header p  { font-size: 12px; color: var(--text-2); margin-top: 2px; font-weight: 500; }

    .field { margin-bottom: 14px; }
    .field label {
      font-size: 11px; font-weight: 600;
      color: var(--text-2); letter-spacing: .04em; text-transform: uppercase;
      display: block; margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface2);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .field input:focus {
      outline: none;
      border-color: var(--green);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(15,157,88,.12);
    }
    .field input::placeholder { color: var(--text-3); }

    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    
    .btn-cancel {
      flex: 1;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      padding: 10px;
      background: none;
      font-size: 13px; font-family: inherit; font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s ease;
    }
    .btn-cancel:hover { background: var(--surface2); }

    .btn-save {
      flex: 2;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 10px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background .15s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-save:hover { background: var(--green-dark); }
    .btn-save:disabled { background: var(--text-3); cursor: not-allowed; }

    /* ── Toast Feedback ──────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1C1C1E; color: #fff;
      padding: 10px 20px; border-radius: 99px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      box-shadow: var(--shadow-md);
      transition: opacity .2s ease, bottom .2s ease;
      z-index: 500;
    }
    .toast.show { opacity: 1; bottom: 32px; }

    /* ── Loader Inicial ──────────────────────────── */
    .loader {
      text-align: center; padding: 80px 20px;
      color: var(--text-2); font-size: 14px; font-weight: 500;
    }
    .loader i { font-size: 32px; display: block; margin-bottom: 12px; color: var(--green); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-logo"><i class="ti ti-layout-grid"></i></div>
  <div class="header-info">
    <h1>Painel de Planilhas</h1>
    <p>Selecione um setor corporativo para gerenciar os documentos</p>
  </div>
</div>

<!-- Conteúdo principal -->
<div class="main" id="main">
  <div class="loader" id="loader">
    <i class="ti ti-loader-2"></i>
    Carregando painel de setores…
  </div>
</div>

<!-- Modal de cadastro -->
<div class="modal-bg" id="modal" onclick="handleModalBg(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-header">
      <h2 id="modal-heading">Adicionar planilha</h2>
      <p id="modal-sub">Setor selecionado</p>
    </div>
    <div class="field">
      <label for="inp-name">Nome da planilha *</label>
      <input id="inp-name" placeholder="Ex: Relatório de fechamento mensal" autocomplete="off" />
    </div>
    <div class="field">
      <label for="inp-url">Link do Google Sheets *</label>
      <input id="inp-url" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off" />
    </div>
    <div class="field">
      <label for="inp-desc">Descrição <span style="font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></label>
      <input id="inp-desc" placeholder="Ex: Atualizado todas as segundas-feiras" autocomplete="off" />
    </div>
    <div class="field">
      <label for="inp-pass">Senha para exclusão *</label>
      <input id="inp-pass" type="text" placeholder="Crie uma senha de acesso rápido" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="salvarPlanilha()">
        <i class="ti ti-check"></i> Salvar
      </button>
    </div>
  </div>
</div>

<!-- Modal remover -->
<div class="modal-bg" id="modal-remove" onclick="handleRemoveBg(event)">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2>Excluir planilha</h2>
      <p>Confirme a senha de segurança cadastrada para prosseguir</p>
    </div>
    <div class="field">
      <label for="remove-pass">Senha de exclusão</label>
      <input id="remove-pass" type="text" placeholder="Digite a senha deste documento" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharRemove()">Cancelar</button>
      <button class="btn-save" style="background:#E53935" onclick="removerConfirmado()">
        <i class="ti ti-trash"></i> Excluir
      </button>
    </div>
  </div>
</div>

<!-- Toast de feedback -->
<div class="toast" id="toast"></div>

<script>
// ── Configuração da API ───────────────────────────────────
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzOrVxYQvlC7dMyG4H2kqJfhyuTqw4pk6AGVZEMxghVzE2EOT5oEA5W0d0zV6-5jMiV0g/exec";

// ── Estado do Aplicativo ──────────────────────────────────
let dados = {};
let setorAtivo = null;
let setoresAbertos = new Set();

const META = {
  "Transporte": { icon: "ti-truck", cls: "icon-log" },
  "Operacional": { icon: "ti-settings", cls: "icon-com" },
  "Faturamento": { icon: "ti-receipt", cls: "icon-fat" },
  "RH/DP": { icon: "ti-users", cls: "icon-rh" },
  "Comercial": { icon: "ti-presentation-analytics", cls: "icon-cmr" },
  "Financeiro": { icon: "ti-wallet", cls: "icon-fin" },
  "ADM": { icon: "ti-building-skyscraper", cls: "icon-com" }
};

// ── Motor de Comunicação com o Back ───────────────────────
async function chamarAPI(action, paramData = {}) {
  const response = await fetch(URL_APPS_SCRIPT, {
    method: 'POST',
    mode: 'cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: action, data: paramData })
  });
  return await response.json();
}

// ── Ciclo de Inicialização ────────────────────────────────
window.addEventListener('DOMContentLoaded', carregarDados);

function carregarDados() {
  chamarAPI('getTodasPlanilhas')
    .then(onDadosCarregados)
    .catch(onErro);
}

function onDadosCarregados(resultado) {
  dados = resultado;
  renderizar();
}

// ── Renderização Dinâmica ─────────────────────────────────
function renderizar() {
  const main = document.getElementById('main');
  const setores = Object.keys(dados);

  if (!setores.length) {
    main.innerHTML = '<p style="color:var(--text-3);padding:40px;text-align:center;font-size:13px;">Nenhum setor encontrado na base de dados.</p>';
    return;
  }

  main.innerHTML = setores.map(setor => {
    const planilhas = dados[setor] || [];
    const meta = META[setor] || { icon: "ti-folder", cls: "icon-com" };
    const aberto = setoresAbertos.has(setor);

    return `
      <div class="sector${aberto ? ' open' : ''}" data-setor="${esc(setor)}">
        <div class="sector-header" onclick="toggleSetor('${esc(setor)}')">
          <div class="sector-icon ${meta.cls}">
            <i class="ti ${meta.icon}" aria-hidden="true"></i>
          </div>
          <span class="sector-name">${esc(setor)}</span>
          <span class="sector-badge">${planilhas.length} planilha${planilhas.length !== 1 ? 's' : ''}</span>
          <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
        </div>

        <div class="sector-body">
          ${planilhas.length === 0
            ? `<div class="empty-state">
                <i class="ti ti-database-off"></i>
                Nenhuma planilha cadastrada neste setor
              </div>`
            : ''}
          <div class="cards-grid">
            ${planilhas.map(p => cardHTML(p)).join('')}
          </div>
          <button class="btn-add" onclick="abrirModal('${esc(setor)}')">
            <i class="ti ti-plus" aria-hidden="true"></i>
            Adicionar planilha
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function cardHTML(p) {
  return `
    <div class="card">
      <div class="card-top">
        <div class="card-gs-icon" title="Google Sheets"></div>
        <span class="card-title">${esc(p.nome)}</span>
      </div>
      ${p.descricao ? `<div class="card-desc">${esc(p.descricao)}</div>` : ''}
      <div class="card-actions">
        <button class="btn-open" onclick="abrirLink('${esc(p.url)}')">
          <i class="ti ti-external-link" aria-hidden="true"></i> Abrir
        </button>
        <button class="btn-del" onclick="confirmarRemocao('${esc(p.id)}')" title="Remover planilha">
          <i class="ti ti-trash" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  `;
}

function toggleSetor(setor) {
  if (setoresAbertos.has(setor)) {
    setoresAbertos.delete(setor);
  } else {
    setoresAbertos.add(setor);
  }
  const el = document.querySelector(`.sector[data-setor="${setor}"]`);
  if (el) el.classList.toggle('open');
}

function abrirModal(setor) {
  document.getElementById('inp-pass').value = '';
  setorAtivo = setor;
  document.getElementById('modal-sub').textContent = '📂 Setor: ' + setor;
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-url').value  = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('btn-save').disabled = false;
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('inp-name').focus(), 120);
}

function fecharModal() {
  document.getElementById('modal').classList.remove('show');
  setorAtivo = null;
}

function handleModalBg(e) {
  if (e.target === document.getElementById('modal')) fecharModal();
}

function salvarPlanilha() {
  const nome  = document.getElementById('inp-name').value.trim();
  const url   = document.getElementById('inp-url').value.trim();
  const desc  = document.getElementById('inp-desc').value.trim();
  const senha = document.getElementById('inp-pass').value.trim();

  if (!nome) return mostrarToast('⚠️ Defina um nome para a planilha.');
  if (!url || !url.startsWith('http')) return mostrarToast('⚠️ Insira uma URL válida do Google Sheets.');
  if (!senha || senha.length < 4) return mostrarToast('⚠️ A senha de segurança deve conter no mínimo 4 caracteres.');

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Salvando…';

  chamarAPI('adicionarPlanilha', {
    setor: setorAtivo,
    nome: nome,
    url: url,
    descricao: desc,
    senha: senha
  })
  .then(res => {
    if (res && res.error) throw new Error(res.error);
    onSalvo(res);
  })
  .catch(onErro);
}

function onSalvo(res) {
  fecharModal();
  mostrarToast('✅ Planilha registrada com sucesso!');
  carregarDados();
}

let idRemocao = null;

function confirmarRemocao(id) {
  idRemocao = id;
  document.getElementById('remove-pass').value = '';
  document.getElementById('modal-remove').classList.add('show');
  setTimeout(() => document.getElementById('remove-pass').focus(), 120);
}

function fecharRemove() {
  document.getElementById('modal-remove').classList.remove('show');
  idRemocao = null;
}

function handleRemoveBg(e) {
  if (e.target === document.getElementById('modal-remove')) fecharRemove();
}

function removerConfirmado() {
  const senha = document.getElementById('remove-pass').value.trim();
  if (!senha) return mostrarToast('⚠️ Digite a senha para confirmar a exclusão.');

  chamarAPI('removerPlanilha', { id: idRemocao, senha: senha })
    .then(res => {
      if (res && res.error) {
        mostrarToast('❌ ' + res.error);
      } else {
        fecharRemove();
        mostrarToast('🗑️ Planilha removida permanentemente.');
        carregarDados();
      }
    })
    .catch(onErro);
}

function abrirLink(url) { window.open(url, '_blank'); }

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function onErro(err) {
  console.error(err);
  mostrarToast('❌ Erro operacional: ' + (err.message || err));
  const btn = document.getElementById('btn-save');
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-check"></i> Salvar';
  }
}
</script>
</body>
</html>
